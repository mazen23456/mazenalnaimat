	<script>
		// window.addEventListener('resize', function() {
// 	resizeCanvas(innerWidth, innerHeight)
  
// })


var bubbles = [],
	bubbleAmount = 50, 
    triangles = []

function setup() {
	createCanvas(innerWidth, innerHeight)
	for (var i = 0; i < bubbleAmount; i++) {
		bubbles.push(new bubble(random(width), random(height), random(5, 8)));
    triangles.push(new createTriangles(random(width), random(height)))
	}
}



function createTriangles(x, y) {
  this.x1 = x;
  this.y1 = y;
  this.x2 = x + 9;
  this.y2 = y - 9;
  this.x3 = x + 18;
  this.y3 = y - 1;
  
  this.xspeed = random(-0.4, 0.4)
	this.yspeed = random(-0.4, 0.4)

	this.update = () => {
		this.x1 = this.x1 + this.xspeed
		this.y1 = this.y1 + this.yspeed
    this.x2 = this.x2 + this.xspeed
		this.y2 = this.y2 + this.yspeed
    this.x3 = this.x3 + this.xspeed
		this.y3 = this.y3 + this.yspeed
		if (this.x1 < 0 || this.x1 > width) {
			this.xspeed = this.xspeed * -1
		}
		if (this.y1 < 0 || this.y1 > height) {
			this.yspeed = this.yspeed * -1
		}
		if (this.x1 < 0) {
			this.x1 = 0
		}
		if (this.x1 > width) {
			this.x1 = width
		}
		if (this.y1 < 0) {
			this.y1 = 0
		}
		if (this.y1 > height) {
			this.y1 = height
		}
	}

	this.show = () => {
   
		triangle(this.x1, this.y1, this.x2, this.y2, this.x3, this.y3 )
    
	}
}

function draw() {
	background('#fff')
  // fill("#0ABFBC")
  fill("#FA2A00")
	noStroke()
	bubbles.forEach(x => {
		x.update()
		x.show()
	})
  // fill('#F2D694')
  fill("#86B8B1")
  triangles.forEach(x => {
		x.update()
		x.show()
	})
}



function bubble(x, y, radius) {
	this.x = x
	this.y = y
	this.radius = radius
	this.xspeed = random(-0.4, 0.4)
	this.yspeed = random(-0.4, 0.4)

	this.update = () => {
		this.x = this.x + this.xspeed
		this.y = this.y + this.yspeed
		if (this.x < 0 || this.x > width) {
			this.xspeed = this.xspeed * -1
		}
		if (this.y < 0 || this.y > height) {
			this.yspeed = this.yspeed * -1
		}
		if (this.x < 0) {
			this.x = 0
		}
		if (this.x > width) {
			this.x = width
		}
		if (this.y < 0) {
			this.y = 0
		}
		if (this.y > height) {
			this.y = height
		}
	}

	this.show = () => {
   
		ellipse(this.x, this.y, this.radius)
    
	}
}


	</script>
