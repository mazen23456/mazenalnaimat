<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Mazen</title>
	<link rel="stylesheet" type="text/css" media="screen" href="/master.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
	<style>
		#projects {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
		}
		.maintenance-box {
			text-align: center;
			padding: 2em;
			max-width: 500px;
		}
		.maintenance-icon {
			width: 80px;
			height: 80px;
			margin-bottom: 1em;
		}
		.maintenance-box h2 {
			padding: 0 0 15px 0;
			font-size: 1.8em;
		}
		.maintenance-box p {
			color: #555555;
			font-size: 1em;
			line-height: 1.6em;
			margin-bottom: 1.5em;
		}
		.progress-track {
			width: 100%;
			height: 8px;
			background: #ffffff;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: inset 0 1px 3px rgba(45, 45, 45, 0.15);
		}
		.progress-fill {
			height: 100%;
			width: 45%;
			background: linear-gradient(90deg, #86B8B1, #FA2A00);
			border-radius: 10px;
			animation: pulse 2s ease-in-out infinite;
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.6; }
		}
		.maintenance-note {
			margin-top: 1em;
			font-size: 0.8em;
			color: #999999;
		}
	</style>
</head>
<body>
	
  <div class='navbar'>
    <nav>
      <ul>
      
      </ul>
    </nav>
  </div>
  <div id="welcome-section">
    <div id="main-info">
      <h1>Hi there, I'm Mazen 👋</h1>
      <!--   <p>blabefefefeblabefefefeblabefefefeblabefefefee</p> -->
    </div>
  </div> 
	  <div id="projects">
    <div class="maintenance-box">
      <svg class="maintenance-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          stroke="#FA2A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>Under Maintenance</h2>
      <p>This section is being rebuilt. New projects are on their way — check back soon.</p>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <p class="maintenance-note">Thanks for your patience 🌱</p>
    </div>
  </div>
 
	<script>
		var bubbles = [],
			bubbleAmount = 50, 
			triangles = []

		function setup() {
			var canvas = createCanvas(innerWidth, innerHeight);
			canvas.style('position', 'fixed');
			canvas.style('top', '0');
			canvas.style('left', '0');
			canvas.style('z-index', '-1');
			for (var i = 0; i < bubbleAmount; i++) {
				bubbles.push(new bubble(random(width), random(height), random(5, 8)));
				triangles.push(new createTriangles(random(width), random(height)));
			}
		}

		function windowResized() {
			resizeCanvas(innerWidth, innerHeight);
		}

		function createTriangles(x, y) {
			this.x1 = x;
			this.y1 = y;
			this.x2 = x + 9;
			this.y2 = y - 9;
			this.x3 = x + 18;
			this.y3 = y - 1;

			this.xspeed = random(-0.4, 0.4);
			this.yspeed = random(-0.4, 0.4);
			this.update = () => {
				this.x1 = this.x1 + this.xspeed;
				this.y1 = this.y1 + this.yspeed;
				this.x2 = this.x2 + this.xspeed;
				this.y2 = this.y2 + this.yspeed;
				this.x3 = this.x3 + this.xspeed;
				this.y3 = this.y3 + this.yspeed;
				if (this.x1 < 0 || this.x1 > width) {
					this.xspeed = this.xspeed * -1;
				}
				if (this.y1 < 0 || this.y1 > height) {
					this.yspeed = this.yspeed * -1;
				}
				if (this.x1 < 0) {
					this.x1 = 0;
				}
				if (this.x1 > width) {
					this.x1 = width;
				}
				if (this.y1 < 0) {
					this.y1 = 0;
				}
				if (this.y1 > height) {
					this.y1 = height;
				}
			}
			this.show = () => {
				triangle(this.x1, this.y1, this.x2, this.y2, this.x3, this.y3);
			}
		}

		function draw() {
			background('#fff');
			fill("#FA2A00");
			noStroke();
			bubbles.forEach(x => {
				x.update();
				x.show();
			});
			fill("#86B8B1");
			triangles.forEach(x => {
				x.update();
				x.show();
			});
		}

		function bubble(x, y, radius) {
			this.x = x;
			this.y = y;
			this.radius = radius;
			this.xspeed = random(-0.4, 0.4);
			this.yspeed = random(-0.4, 0.4);
			this.update = () => {
				this.x = this.x + this.xspeed;
				this.y = this.y + this.yspeed;
				if (this.x < 0 || this.x > width) {
					this.xspeed = this.xspeed * -1;
				}
				if (this.y < 0 || this.y > height) {
					this.yspeed = this.yspeed * -1;
				}
				if (this.x < 0) {
					this.x = 0;
				}
				if (this.x > width) {
					this.x = width;
				}
				if (this.y < 0) {
					this.y = 0;
				}
				if (this.y > height) {
					this.y = height;
				}
			}
			this.show = () => {
				ellipse(this.x, this.y, this.radius);
			}
		}
	</script>
</body>
</html>
