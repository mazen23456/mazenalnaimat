<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazen Al-Naimat | قيد التطوير</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 12px;
            background: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; line-height: 1.6; color: #8b949e; }
        .badge {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مازن النعيمات</h1>
        <p>الموقع الشخصي والبورتفوليو حالياً قيد التحديث والتطوير 🚀</p>
        <div class="badge">Under Maintenance</div>
    </div>
</body>
</html>
